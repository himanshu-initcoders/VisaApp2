# Visa platform — Hostinger KVM (same VPS: app + Postgres + Caddy + Jenkins)
# Env file on server: /opt/visa/.env (never commit secrets)

name: visa

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-visa_db}
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql (not .../data)
      - pgdata:/var/lib/postgresql
    # Admin access only from the host loopback (no public 5432)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-visa} -d ${POSTGRES_DB:-visa_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - visa_net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate
    networks:
      - visa_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      # Reach published Postgres on the host during `next build` page collection
      network: host
      args:
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
        NEXT_PUBLIC_TINYMCE_API_KEY: ${NEXT_PUBLIC_TINYMCE_API_KEY:-}
        # Use loopback (not hostname `db`) because build network is host
        DATABASE_URL: postgresql://${POSTGRES_USER:-visa}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-visa_db}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - visa_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - visa_net

  jenkins:
    build:
      context: ./deploy/jenkins
      dockerfile: Dockerfile
    restart: unless-stopped
    # Not on the public internet — SSH tunnel: ssh -L 8080:127.0.0.1:8080 user@vps
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    environment:
      JAVA_OPTS: "-Xmx512m"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/visa:rw
    working_dir: /opt/visa
    group_add:
      # Host docker group GID — override in .env if `getent group docker` differs
      - "${DOCKER_GID:-999}"
    deploy:
      resources:
        limits:
          memory: 1280M
    networks:
      - visa_net

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  jenkins_home:

networks:
  visa_net:
    driver: bridge
