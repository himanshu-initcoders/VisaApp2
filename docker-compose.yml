# Visa platform — Hostinger KVM
# Postgres runs on the HOST (not Docker). App/migrate reach it via host.docker.internal.
# Env file on server: /opt/visa/.env (never commit secrets)

name: visa

services:
  migrate:
    image: visa-migrate:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - migrate
    networks:
      - visa_net

  app:
    image: visa-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - visa_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - visa_net

  jenkins:
    build:
      context: ./deploy/jenkins
      dockerfile: Dockerfile
    restart: unless-stopped
    # Not on the public internet — SSH tunnel: ssh -L 8080:127.0.0.1:8080 user@vps
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    environment:
      JAVA_OPTS: "-Xmx512m"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/visa:rw
    working_dir: /opt/visa
    group_add:
      - "${DOCKER_GID:-999}"
    deploy:
      resources:
        limits:
          memory: 1280M
    networks:
      - visa_net

volumes:
  caddy_data:
  caddy_config:
  jenkins_home:

networks:
  visa_net:
    driver: bridge
